function b64(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,CIPHER);
  return new TextDecoder().decode(pt);
}

  const err=document.getElementById("err"); err.textContent="…";
  try{
    const html=await decrypt(document.getElementById("pw").value);
    try{sessionStorage.setItem("dash_ok","1");}catch(_){}
    document.open();document.write(html);document.close();

});
